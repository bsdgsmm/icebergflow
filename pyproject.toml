[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icebergflow"
version = "0.1.0"
description = "A local-first data lakehouse built with Apache Spark and Apache Iceberg."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pyspark==4.0.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[project.scripts]
icebergflow = "icebergflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"icebergflow.lakehouse" = ["resources/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL", "RUF", "T20"]
# Heavy imports (pyspark) are deferred inside CLI handlers on purpose.
ignore = ["PLR0913", "PLR2004", "PLC0415"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "integration: tests that start a local Spark session and write Iceberg tables",
]
